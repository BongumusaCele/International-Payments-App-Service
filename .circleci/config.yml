version: 2.1

jobs:
  backend-quality-and-sonar:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:10.0

    environment:
      PROJECT_PATH: InternationalPaymentsAPI/InternationalPaymentsAPI.csproj
      SONAR_PROJECT_KEY: BongumusaCele_International-Payments-App-Service
      SONAR_ORGANIZATION: bongumusacele

    steps:
      - checkout:
          method: full

      - restore_cache:
          keys:
            - nuget-cache-v1-{{ checksum "InternationalPaymentsAPI/InternationalPaymentsAPI.csproj" }}
            - nuget-cache-v1-

      - run:
          name: Install Java for SonarScanner
          command: |
            apt-get update
            apt-get install -y --no-install-recommends openjdk-17-jre

      - run:
          name: Restore dependencies
          command: dotnet restore "$PROJECT_PATH"

      - save_cache:
          key: nuget-cache-v1-{{ checksum "InternationalPaymentsAPI/InternationalPaymentsAPI.csproj" }}
          paths:
            - ~/.nuget/packages

      - run:
          name: Check NuGet packages for known vulnerabilities
          command: dotnet list "$PROJECT_PATH" package --vulnerable --include-transitive

      - run:
          name: Validate SonarCloud token
          command: |
            if [ -z "$SONAR_TOKEN" ]; then
              echo "Missing CircleCI environment variable: SONAR_TOKEN"
              exit 1
            fi

      - run:
          name: Install SonarScanner for .NET
          command: dotnet tool install --global dotnet-sonarscanner

      - run:
          name: Run build with SonarCloud analysis
          command: |
            export PATH="$PATH:$HOME/.dotnet/tools"
            dotnet sonarscanner begin \
              /k:"$SONAR_PROJECT_KEY" \
              /o:"$SONAR_ORGANIZATION" \
              /d:sonar.host.url="https://sonarcloud.io" \
              /d:sonar.token="$SONAR_TOKEN" \
              /d:sonar.qualitygate.wait=true \
              /d:sonar.exclusions="**/bin/**,**/obj/**,**/Migrations/**,**/*.Designer.cs"

            dotnet build "$PROJECT_PATH" --configuration Release --no-restore

            dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - run:
          name: Run tests if configured
          command: |
            TEST_PROJECTS=$(find . -name "*.csproj" | grep -Ei "(Tests|Test)" || true)

            if [ -z "$TEST_PROJECTS" ]; then
              echo "No test projects found. Skipping dotnet test."
              exit 0
            fi

            for project in $TEST_PROJECTS; do
              dotnet test "$project" --configuration Release
            done

      - run:
          name: Publish backend
          command: dotnet publish "$PROJECT_PATH" --configuration Release --no-build --output ./publish

      - persist_to_workspace:
          root: .
          paths:
            - publish

workflows:
  backend-devsecops:
    jobs:
      - backend-quality-and-sonar
